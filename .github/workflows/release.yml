name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install --global npm@latest

      - run: bun install --frozen-lockfile

      - run: node scripts/version.mjs --check "$GITHUB_REF_NAME"

      - run: bun run typecheck

      - run: bun test

      # A version that is already on npm is skipped, so a failed run can be started again.
      - name: Publish packages
        run: |
          for directory in packages/*/; do
            name=$(jq -r .name "$directory/package.json")
            version=$(jq -r .version "$directory/package.json")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
              continue
            fi
            npm publish "./$directory" --access public
          done

      - name: Publish kit
        run: |
          version=$(jq -r .version package.json)
          if npm view "@cheetahbyte/pi-kit@$version" version >/dev/null 2>&1; then
            echo "@cheetahbyte/pi-kit@$version is already published"
            exit 0
          fi
          sh scripts/pack-kit.sh
          npm publish "cheetahbyte-pi-kit-$version.tgz" --access public
